            <div class="w-full h-56 sm:h-96 md:h-150 rounded-2xl bg-[#2749F5] overflow-hidden">

                        </div>

                    </div>
                    <label for="Dish-name" class="text-gray-400">Dish name</label>
                    <input type="text" id="dish_name" placeholder="Dish Name" class="text-gray-200 bg-gray-700 py-2.5 px-3 rounded-2xl focus:outline-none focus:ring-0">
                    <label for="Category" class="text-gray-400 ">Category</label>
                    <select name="Category" id="Category" class="text-gray-400 bg-gray-700 py-2.5 px-3 rounded-2xl focus:outline-none focus:ring-0">
                        <option value="Starter">Starter</option>
                        <option value="Main">Main</option>
                        <option value="Dessert">Dessert</option>
                    </select>
                    <label for="Price" class="text-gray-400">Price</label>
                    <input type="text" id="Price" placeholder="Price" class="text-gray-200 bg-gray-700 py-2.5 px-3 rounded-2xl focus:outline-none focus:ring-0">
                    <label for="Quality-badge" class="text-gray-400">Quality badge</label>
                    <select name="Quality-badge" id="quality_Badge" class="text-gray-400 bg-gray-700 py-2.5 px-3 rounded-2xl focus:outline-none focus:ring-0">
                        <option value="Vegetarian">Vegetarian</option>
                        <option value="Homemade">Homemade</option>
                        <option value="Healthy">Healthy</option>
                        <option value="Spicy">Spicy</option>
                    </select>
                    <div class="flex items-center justify-end">
                        <bottun type="submit" id="cancel_popup" class="bg-gray-700 px-4 py-2 rounded-3xl text-white cursor-pointer hover:bg-gray-400">Cancel</bottun>
                        <bottun id="save_btn_popup" class="bg-red-700 px-4 py-2 rounded-3xl text-white ml-5 cursor-pointer hover:bg-red-400">Save</bottun>
                    </div>
                </div>
